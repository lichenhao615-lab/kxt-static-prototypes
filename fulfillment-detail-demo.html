<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=1920, initial-scale=1">
	<title>履约详情 · 内部运营版 · 跨信通</title>
	<link rel="stylesheet" href="fulfillment-detail-demo.css">
</head>
<body>
	<svg class="icon-defs" aria-hidden="true">
		<symbol id="i-check" viewBox="0 0 24 24"><path d="m20 6-11 11-5-5"/></symbol>
		<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
		<symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7M5 12h14"/></symbol>
		<symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7M12 19V5"/></symbol>
		<symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="m5 12 7 7 7-7M12 5v14"/></symbol>
		<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
		<symbol id="i-x" viewBox="0 0 24 24"><path d="m18 6-12 12M6 6l12 12"/></symbol>
		<symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
		<symbol id="i-rotate" viewBox="0 0 24 24"><path d="M3 11a9 9 0 1 1 2.7 7M3 3v8h8"/></symbol>
		<symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h6"/></symbol>
		<symbol id="i-alert" viewBox="0 0 24 24"><path d="m10.3 3.9-8.1 14a2 2 0 0 0 1.7 3h16.2a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0M12 9v4M12 17h.01"/></symbol>
		<symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.7-6.4L3 8M3 3v5h5M12 7v5l3 2"/></symbol>
		<symbol id="i-settings" viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M3 12h2M19 12h2M12 3v2M12 19v2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></symbol>
		<symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M5 6l1 14h12l1-14M10 10v6M14 10v6"/></symbol>
		<symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
	</svg>
	<header class="system-bar">
		<div class="system-brand"><span class="brand-mark">Tax</span>跨信通税务管理系统</div>
		<nav class="system-nav" aria-label="系统导航"><span>系统管理</span><span class="selected">业务管理</span><span>CRM</span><span>客服工单</span><span>测试平台</span><span>数据平台</span></nav>
		<div class="system-user"><span class="demo-label">演示数据</span><span class="user-avatar">李</span>李晨浩</div>
	</header>
	<aside class="side-nav" aria-label="业务导航">
		<div class="side-item">首页<span>⌃</span></div>
		<div class="side-item sub">履约工作台</div><div class="side-item sub">我的导入/导出</div><div class="side-item sub">导出审核</div>
		<div class="side-item">订单管理<span>⌄</span></div><div class="side-item">续费管理<span>⌄</span></div><div class="side-item">客户管理<span>⌄</span></div>
		<div class="side-item">VAT税务<span>⌄</span></div><div class="side-item">EPR合规<span>⌄</span></div><div class="side-item">授权代表管理<span>⌄</span></div><div class="side-item">知识产权<span>⌄</span></div>
		<div class="side-item expanded">履约管理<span>⌃</span></div><div class="side-item sub expanded">服务管理<span>⌃</span></div>
		<button class="side-item leaf selected" data-action="view-detail">基础服务</button>
		<div class="side-item leaf">增值服务</div><div class="side-item leaf">追加服务</div><div class="side-item leaf">续费服务</div>
		<button class="side-item sub" data-action="view-config">流程配置</button>
		<div class="side-item">任务管理<span>⌄</span></div><div class="side-item">SLA管理<span>⌄</span></div>
	</aside>
	<nav class="workspace-tabs" aria-label="工作区标签">
		<span>履约工作台</span><span>基础服务</span>
		<button id="detailTab" class="selected" data-action="view-detail">履约单详情</button>
		<button id="configTab" data-action="view-config">流程配置</button>
	</nav>
	<main class="app-shell" id="app"></main>
	<div class="overlay" id="overlay" hidden></div>
	<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden></aside>
	<div class="modal-layer" id="modalLayer" hidden><section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></section></div>
	<div class="toast" id="toast" role="status" hidden></div>
	<script src="fulfillment-detail-demo.js"></script>
</body>
</html>
