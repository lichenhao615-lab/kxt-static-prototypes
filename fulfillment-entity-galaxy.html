<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>履约全链路实体星图</title>
	<style>
		:root {
			--bg: #080b14;
			--bg-deep: #03050b;
			--panel: rgba(12, 18, 32, .82);
			--panel-strong: rgba(15, 24, 43, .94);
			--line: rgba(157, 180, 230, .22);
			--line-active: rgba(103, 232, 249, .94);
			--text: #f4f7fb;
			--muted: #a9b5c7;
			--dim: #69758c;
			--gold: #f8c76b;
			--cyan: #67e8f9;
			--green: #7ee787;
			--pink: #f58abc;
			--violet: #b49cff;
			--orange: #ffb86b;
			--blue: #8ab4ff;
			--red: #ff8f8f;
			--shadow: 0 22px 70px rgba(0, 0, 0, .38);
			color-scheme: dark;
			font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			color: var(--text);
			background:
				radial-gradient(circle at 18% 14%, rgba(46, 134, 193, .28), transparent 27%),
				radial-gradient(circle at 82% 20%, rgba(248, 199, 107, .14), transparent 25%),
				radial-gradient(circle at 66% 84%, rgba(245, 138, 188, .16), transparent 26%),
				linear-gradient(135deg, var(--bg-deep), var(--bg) 56%, #101323);
			overflow-x: hidden;
		}

		button {
			font: inherit;
		}

		.app {
			position: relative;
			min-height: 100vh;
			padding: 22px;
			isolation: isolate;
		}

		.stars,
		.stars::before,
		.stars::after {
			position: fixed;
			inset: 0;
			pointer-events: none;
			background-image:
				radial-gradient(circle, rgba(255, 255, 255, .72) 0 1px, transparent 1.5px),
				radial-gradient(circle, rgba(103, 232, 249, .48) 0 1px, transparent 1.4px);
			background-size: 91px 91px, 137px 137px;
			background-position: 0 0, 28px 36px;
			opacity: .35;
			z-index: -3;
		}

		.stars::before {
			content: "";
			transform: rotate(7deg) scale(1.18);
			animation: driftStars 26s linear infinite;
			opacity: .22;
		}

		.stars::after {
			content: "";
			background-size: 173px 173px, 211px 211px;
			background-position: 42px 17px, 10px 76px;
			animation: driftStars 38s linear infinite reverse;
			opacity: .18;
		}

		@keyframes driftStars {
			from { translate: 0 0; }
			to { translate: 80px 44px; }
		}

		.topbar {
			display: grid;
			grid-template-columns: minmax(280px, 1fr) auto;
			align-items: start;
			gap: 18px;
			margin: 0 auto 16px;
			max-width: 1520px;
		}

		.title-block {
			min-width: 0;
		}

		h1 {
			margin: 0;
			font-size: clamp(26px, 3vw, 42px);
			line-height: 1.15;
			letter-spacing: 0;
			font-weight: 760;
		}

		.lead {
			margin: 10px 0 0;
			max-width: 900px;
			color: var(--muted);
			font-size: 15px;
			line-height: 1.8;
		}

		.toolbar {
			display: flex;
			align-items: center;
			justify-content: flex-end;
			flex-wrap: wrap;
			gap: 8px;
		}

		.control-btn,
		.layer-btn,
		.next-btn,
		.mobile-toggle {
			border: 1px solid rgba(255, 255, 255, .14);
			color: var(--text);
			background: rgba(255, 255, 255, .08);
			border-radius: 8px;
			min-height: 38px;
			padding: 0 13px;
			cursor: pointer;
			transition: border-color .18s ease, background .18s ease, color .18s ease, transform .18s ease;
		}

		.control-btn:hover,
		.layer-btn:hover,
		.next-btn:hover,
		.mobile-toggle:hover {
			border-color: rgba(103, 232, 249, .6);
			background: rgba(103, 232, 249, .12);
		}

		.control-btn:active,
		.layer-btn:active,
		.next-btn:active,
		.mobile-toggle:active {
			transform: translateY(1px);
		}

		.control-btn.primary {
			background: linear-gradient(135deg, rgba(103, 232, 249, .22), rgba(248, 199, 107, .18));
			border-color: rgba(103, 232, 249, .42);
		}

		.shell {
			display: grid;
			grid-template-columns: minmax(720px, 1fr) 390px;
			gap: 18px;
			align-items: start;
			max-width: 1520px;
			margin: 0 auto;
		}

		.map-card,
		.detail-card {
			position: relative;
			border: 1px solid rgba(255, 255, 255, .12);
			background: linear-gradient(180deg, rgba(14, 21, 38, .72), rgba(8, 13, 25, .9));
			box-shadow: var(--shadow);
			backdrop-filter: blur(18px);
			overflow: hidden;
		}

		.map-card {
			min-height: 780px;
			height: 780px;
			border-radius: 18px;
		}

		.detail-card {
			border-radius: 18px;
			padding: 18px;
			min-height: 780px;
		}

		.map-card::before {
			content: "";
			position: absolute;
			inset: 6%;
			background:
				radial-gradient(ellipse at center, rgba(103, 232, 249, .09), transparent 42%),
				conic-gradient(from 140deg, rgba(103, 232, 249, .09), rgba(248, 199, 107, .08), rgba(245, 138, 188, .08), rgba(126, 231, 135, .08), rgba(103, 232, 249, .09));
			filter: blur(30px);
			opacity: .72;
			pointer-events: none;
		}

		.map-card::after {
			content: "";
			position: absolute;
			inset: 46px;
			border: 1px solid rgba(255, 255, 255, .09);
			border-radius: 50%;
			box-shadow:
				0 0 0 90px rgba(255, 255, 255, .025),
				0 0 0 178px rgba(255, 255, 255, .018),
				0 0 0 268px rgba(255, 255, 255, .012);
			pointer-events: none;
		}

		.map-card.warping::before {
			animation: nebulaPulse .9s ease both;
		}

		.map-card.warping::after {
			animation: orbitShock .9s ease both;
		}

		@keyframes nebulaPulse {
			0% { opacity: .72; filter: blur(30px) saturate(1); }
			46% { opacity: 1; filter: blur(18px) saturate(1.7); }
			100% { opacity: .72; filter: blur(30px) saturate(1); }
		}

		@keyframes orbitShock {
			0% { opacity: 1; transform: scale(1); }
			45% { opacity: .88; transform: scale(1.035); box-shadow: 0 0 0 110px rgba(103, 232, 249, .04), 0 0 0 210px rgba(248, 199, 107, .03), 0 0 0 304px rgba(245, 138, 188, .025); }
			100% { opacity: 1; transform: scale(1); }
		}

		.map-head {
			position: absolute;
			z-index: 5;
			top: 18px;
			left: 18px;
			right: 18px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			pointer-events: none;
		}

		.focus-label {
			display: flex;
			align-items: center;
			gap: 10px;
			min-width: 0;
			padding: 9px 12px;
			border: 1px solid rgba(255, 255, 255, .12);
			border-radius: 10px;
			background: rgba(5, 10, 20, .62);
		}

		.focus-label b {
			white-space: nowrap;
		}

		.focus-label span {
			min-width: 0;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
			color: var(--muted);
			font-size: 13px;
		}

		.legend {
			display: flex;
			flex-wrap: wrap;
			justify-content: flex-end;
			gap: 6px;
		}

		.legend-item {
			display: flex;
			align-items: center;
			gap: 6px;
			padding: 6px 8px;
			border-radius: 8px;
			background: rgba(5, 10, 20, .52);
			border: 1px solid rgba(255, 255, 255, .1);
			color: var(--muted);
			font-size: 12px;
		}

		.dot {
			width: 8px;
			height: 8px;
			border-radius: 999px;
			background: var(--dot, var(--cyan));
			box-shadow: 0 0 14px var(--dot, var(--cyan));
		}

		.galaxy {
			position: absolute;
			inset: 0;
			overflow: hidden;
		}

		.galaxy::before {
			content: "";
			position: absolute;
			left: calc(var(--focus-x, 50) * 1%);
			top: calc(var(--focus-y, 48) * 1%);
			z-index: 2;
			width: 220px;
			height: 220px;
			border-radius: 50%;
			background:
				radial-gradient(circle, rgba(255, 255, 255, .18) 0 6%, rgba(103, 232, 249, .2) 7% 18%, transparent 52%),
				conic-gradient(from var(--spin, 0deg), transparent, rgba(103, 232, 249, .36), transparent, rgba(248, 199, 107, .22), transparent);
			filter: blur(3px);
			opacity: .72;
			transform: translate(-50%, -50%);
			transition: left .72s cubic-bezier(.18, .84, .2, 1), top .72s cubic-bezier(.18, .84, .2, 1), opacity .2s ease;
			animation: coreSpin 8s linear infinite;
			pointer-events: none;
		}

		.galaxy::after {
			content: "";
			position: absolute;
			left: calc(var(--focus-x, 50) * 1%);
			top: calc(var(--focus-y, 48) * 1%);
			z-index: 2;
			width: 360px;
			height: 360px;
			border-radius: 50%;
			background:
				repeating-conic-gradient(from var(--spin, 0deg), rgba(255,255,255,.08) 0 2deg, transparent 2deg 16deg),
				radial-gradient(circle, transparent 44%, rgba(103, 232, 249, .16) 45%, transparent 56%);
			opacity: .26;
			transform: translate(-50%, -50%) rotate(var(--spin, 0deg));
			transition: left .72s cubic-bezier(.18, .84, .2, 1), top .72s cubic-bezier(.18, .84, .2, 1), transform .72s cubic-bezier(.18, .84, .2, 1);
			pointer-events: none;
		}

		@keyframes coreSpin {
			from { rotate: 0deg; }
			to { rotate: 360deg; }
		}

		.space-camera {
			position: absolute;
			inset: 0;
			z-index: 1;
			transform-origin: center;
			transform: translate(var(--cam-x, 0px), var(--cam-y, 0px)) scale(var(--cam-scale, 1));
			transition: transform .82s cubic-bezier(.18, .84, .2, 1);
			will-change: transform;
		}

		.map-card.warping .space-camera {
			transition-duration: .92s;
			filter: saturate(1.25);
		}

		.warp-flash {
			position: absolute;
			inset: 0;
			z-index: 6;
			pointer-events: none;
			background:
				radial-gradient(circle at calc(var(--focus-x, 50) * 1%) calc(var(--focus-y, 48) * 1%), rgba(255, 255, 255, .34), rgba(103, 232, 249, .22) 8%, transparent 31%),
				linear-gradient(115deg, transparent 0 38%, rgba(255, 255, 255, .16) 48%, transparent 59% 100%);
			mix-blend-mode: screen;
			opacity: 0;
		}

		.map-card.warping .warp-flash {
			animation: warpFlash .86s ease both;
		}

		@keyframes warpFlash {
			0% { opacity: 0; transform: scale(.96); }
			32% { opacity: .88; transform: scale(1.02); }
			100% { opacity: 0; transform: scale(1.12); }
		}

		.particle-field {
			position: absolute;
			inset: 0;
			z-index: 7;
			pointer-events: none;
			overflow: hidden;
		}

		.spark {
			position: absolute;
			left: var(--sx);
			top: var(--sy);
			width: var(--sw, 4px);
			height: var(--sw, 4px);
			border-radius: 50%;
			background: var(--sc, var(--cyan));
			box-shadow: 0 0 18px var(--sc, var(--cyan));
			opacity: 0;
			transform: translate(-50%, -50%);
			animation: sparkFlight .76s cubic-bezier(.22, .78, .26, 1) both;
		}

		.spark::after {
			content: "";
			position: absolute;
			top: 50%;
			right: 50%;
			width: var(--tail, 42px);
			height: 1px;
			background: linear-gradient(90deg, transparent, var(--sc, var(--cyan)));
			transform: translateY(-50%) rotate(var(--sr, 0deg));
			transform-origin: right center;
		}

		@keyframes sparkFlight {
			0% { opacity: 0; translate: 0 0; scale: .4; }
			16% { opacity: .95; }
			100% { opacity: 0; translate: var(--tx) var(--ty); scale: .08; }
		}

		#relationLayer {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			pointer-events: none;
			z-index: 1;
		}

		.relation-path {
			fill: none;
			stroke: rgba(160, 180, 220, .2);
			stroke-width: 1.3;
			stroke-dasharray: 4 7;
			transition: stroke .24s ease, stroke-width .24s ease, opacity .24s ease, filter .24s ease;
		}

		.relation-path.active {
			stroke: var(--line-active);
			stroke-width: 2.7;
			stroke-dasharray: none;
			filter: drop-shadow(0 0 8px rgba(103, 232, 249, .5));
			stroke-linecap: round;
			animation: lineSurge 1.4s ease-in-out infinite;
		}

		@keyframes lineSurge {
			0%, 100% { stroke-width: 2.35; opacity: .88; }
			50% { stroke-width: 3.15; opacity: 1; }
		}

		.relation-path.muted {
			opacity: .14;
		}

		.relation-label {
			position: absolute;
			z-index: 3;
			max-width: 150px;
			padding: 5px 7px;
			border-radius: 7px;
			color: #d8e7ff;
			background: rgba(4, 9, 18, .72);
			border: 1px solid rgba(255, 255, 255, .1);
			font-size: 11px;
			line-height: 1.35;
			pointer-events: none;
			opacity: .28;
			transform: translate(-50%, -50%);
			transition: opacity .2s ease, border-color .2s ease, color .2s ease;
		}

		.relation-label.active {
			opacity: 1;
			border-color: rgba(103, 232, 249, .44);
			color: #f6fbff;
		}

		.relation-label.muted {
			display: none;
		}

		.planet {
			position: absolute;
			left: calc(var(--x) * 1%);
			top: calc(var(--y) * 1%);
			z-index: 4;
			width: var(--size);
			height: var(--size);
			border: 0;
			border-radius: 50%;
			padding: 0;
			color: var(--text);
			background:
				radial-gradient(circle at 30% 28%, rgba(255, 255, 255, .9), rgba(255, 255, 255, .2) 12%, transparent 28%),
				radial-gradient(circle at 70% 75%, rgba(0, 0, 0, .28), transparent 38%),
				linear-gradient(135deg, color-mix(in srgb, var(--planet) 95%, #ffffff 12%), color-mix(in srgb, var(--planet) 72%, #061020 28%));
			box-shadow:
				0 0 0 1px rgba(255, 255, 255, .17) inset,
				0 16px 35px rgba(0, 0, 0, .34),
				0 0 32px color-mix(in srgb, var(--planet) 45%, transparent);
			cursor: pointer;
			transform: translate(-50%, -50%) scale(.98);
			transition: left .74s cubic-bezier(.18, .84, .2, 1), top .74s cubic-bezier(.18, .84, .2, 1), transform .24s ease, opacity .24s ease, filter .24s ease, box-shadow .24s ease;
			will-change: left, top, transform;
		}

		.planet::before {
			content: "";
			position: absolute;
			inset: -10px;
			border-radius: 50%;
			border: 1px solid color-mix(in srgb, var(--planet) 46%, transparent);
			opacity: .38;
			transform: rotate(-16deg) scaleX(1.34);
			pointer-events: none;
		}

		.planet::after {
			content: "";
			position: absolute;
			inset: 16%;
			border-radius: 50%;
			border-top: 1px solid rgba(255, 255, 255, .2);
			opacity: .34;
			pointer-events: none;
		}

		.planet:hover {
			transform: translate(-50%, -50%) scale(1.08);
			filter: saturate(1.12) brightness(1.06);
		}

		.planet.active {
			transform: translate(-50%, -50%) scale(1.22);
			box-shadow:
				0 0 0 2px rgba(255, 255, 255, .24) inset,
				0 22px 50px rgba(0, 0, 0, .42),
				0 0 58px color-mix(in srgb, var(--planet) 72%, transparent);
			z-index: 8;
			animation: activePlanetPulse 1.7s ease-in-out infinite;
		}

		.planet.related {
			transform: translate(-50%, -50%) scale(1.06);
			box-shadow:
				0 0 0 1px rgba(255, 255, 255, .2) inset,
				0 18px 36px rgba(0, 0, 0, .38),
				0 0 44px color-mix(in srgb, var(--planet) 60%, transparent);
		}

		@keyframes activePlanetPulse {
			0%, 100% { filter: brightness(1.05) saturate(1.08); }
			50% { filter: brightness(1.22) saturate(1.22); }
		}

		.planet.just-arrived {
			animation: activePlanetPulse 1.7s ease-in-out infinite, arrivalBounce .72s cubic-bezier(.18, .84, .2, 1) both;
		}

		@keyframes arrivalBounce {
			0% { scale: .72; }
			58% { scale: 1.16; }
			100% { scale: 1; }
		}

		.planet.muted {
			opacity: .32;
			filter: grayscale(.45);
		}

		.planet.hidden {
			display: none;
		}

		.planet-name {
			position: absolute;
			left: 50%;
			top: calc(100% + 9px);
			width: 118px;
			transform: translateX(-50%);
			text-align: center;
			color: #f7fbff;
			font-size: 12px;
			line-height: 1.35;
			text-shadow: 0 2px 10px rgba(0, 0, 0, .72);
			pointer-events: none;
		}

		.planet-code {
			position: absolute;
			left: 50%;
			top: 50%;
			transform: translate(-50%, -50%);
			width: 88%;
			color: rgba(255, 255, 255, .9);
			font-size: 11px;
			font-weight: 700;
			line-height: 1.2;
			text-align: center;
			text-shadow: 0 2px 8px rgba(0, 0, 0, .48);
			pointer-events: none;
		}

		.jump-ship {
			position: absolute;
			z-index: 7;
			left: calc(var(--ship-x) * 1%);
			top: calc(var(--ship-y) * 1%);
			width: 18px;
			height: 18px;
			border-radius: 50%;
			background: radial-gradient(circle, #fff 0 24%, var(--cyan) 25% 52%, transparent 53%);
			filter: drop-shadow(0 0 12px rgba(103, 232, 249, .75));
			transform: translate(-50%, -50%);
			transition: left .48s cubic-bezier(.2, .82, .2, 1), top .48s cubic-bezier(.2, .82, .2, 1);
			pointer-events: none;
		}

		.jump-ship::before {
			content: "";
			position: absolute;
			left: -54px;
			top: 50%;
			width: 58px;
			height: 2px;
			border-radius: 999px;
			background: linear-gradient(90deg, transparent, rgba(103, 232, 249, .95));
			transform: translateY(-50%) rotate(var(--ship-angle, 0deg));
			transform-origin: right center;
			opacity: .78;
		}

		.map-card.warping .jump-ship {
			animation: shipBoost .82s ease both;
		}

		@keyframes shipBoost {
			0% { scale: .8; opacity: .6; }
			38% { scale: 1.7; opacity: 1; }
			100% { scale: 1; opacity: 1; }
		}

		.layer-row {
			display: flex;
			flex-wrap: wrap;
			gap: 7px;
			margin: 0 0 16px;
		}

		.layer-btn {
			min-height: 32px;
			padding: 0 10px;
			color: var(--muted);
			font-size: 12px;
		}

		.layer-btn.on {
			color: var(--text);
			background: rgba(103, 232, 249, .14);
			border-color: rgba(103, 232, 249, .4);
		}

		.detail-kicker {
			margin: 0 0 7px;
			color: var(--cyan);
			font-size: 12px;
			font-weight: 700;
		}

		.detail-title {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 10px;
			margin: 0 0 6px;
		}

		.detail-title h2 {
			margin: 0;
			font-size: 25px;
			line-height: 1.25;
			letter-spacing: 0;
		}

		.badge {
			display: inline-flex;
			align-items: center;
			min-height: 27px;
			padding: 0 9px;
			border-radius: 8px;
			color: var(--text);
			background: rgba(255, 255, 255, .08);
			border: 1px solid rgba(255, 255, 255, .12);
			font-size: 12px;
			white-space: nowrap;
		}

		.detail-desc {
			margin: 0 0 16px;
			color: #d7dfec;
			font-size: 14px;
			line-height: 1.75;
		}

		.section {
			margin-top: 16px;
			padding-top: 15px;
			border-top: 1px solid rgba(255, 255, 255, .1);
		}

		.section h3 {
			margin: 0 0 10px;
			color: #f4f7fb;
			font-size: 14px;
			letter-spacing: 0;
		}

		.field-list,
		.relation-list {
			display: grid;
			gap: 7px;
			margin: 0;
			padding: 0;
			list-style: none;
		}

		.field-list li,
		.relation-list li {
			display: grid;
			gap: 4px;
			padding: 10px;
			border-radius: 9px;
			background: rgba(255, 255, 255, .055);

			["flowEdge", "state", "targetStateId"],
			["flowEdge", "formData", "fieldLists 判断"],
			["operate", "operateRole", "按钮权限"],
			["serviceReceipt", "servicePerform", "生成履约主单"],
			["servicePerform", "processFlow", "flow_id"],
			["servicePerform", "state", "state_id / pre_state_id"],
			["servicePerform", "operate", "operate(...) 点击"],
			["servicePerform", "servicePerformInfo", "perform_id"],
			["servicePerformInfo", "formData", "form_data_info"],
			["formTemplate", "formData", "字段结构"],
			["flowJson", "formTemplate", "节点/操作表单配置"],
			["servicePerformInfo", "contract", "contract_file / service_code"],
			["contractTemplate", "contract", "template_id"],
			["contractTemplate", "esign", "templateId"],
			["contract", "esign", "生成/签署"],
			["userInfo", "contractTemplate", "merchandId / signerType"],
			["userInfo", "contract", "签署人/主体"],
			["servicePerform", "statusMessage", "状态变更"],
			["servicePerform", "task", "生成任务"],
			["servicePerform", "track", "跟单/质控"],
			["servicePerform", "sla", "提醒/超时"],
			["statusMessage", "userInfo", "消息接收人"],
			["task", "userInfo", "处理人"],
			["track", "userInfo", "跟单人"]
		].map(([from, to, label]) => ({ from, to, label }));

		const entityById = new Map(entities.map(entity => [entity.id, entity]));
		const galaxy = document.getElementById("galaxy");
		const mapCard = document.getElementById("mapCard");
		const spaceCamera = document.getElementById("spaceCamera");
		const relationLayer = document.getElementById("relationLayer");
		const relationList = document.getElementById("relationList");
		const fieldList = document.getElementById("fieldList");
		const nextGrid = document.getElementById("nextGrid");
		const pathbar = document.getElementById("pathbar");
		const ship = document.getElementById("ship");
		const particleField = document.getElementById("particleField");
		const focusText = document.getElementById("focusText");
		const detailLayer = document.getElementById("detailLayer");
		const detailTitle = document.getElementById("detailTitle");
		const detailCode = document.getElementById("detailCode");
		const detailDesc = document.getElementById("detailDesc");
		const legend = document.getElementById("legend");
		const layers = document.getElementById("layers");
		let activeId = "servicePerform";
		let showAll = false;
		let activeLayers = new Set(Object.keys(layerMeta));
		let pathTrail = ["履约主单"];
		let currentPositions = new Map();
		let previousActiveId = activeId;
		let galaxyRotation = 0;
		let warpTimer = null;

		function percentToSvg(value, axis) {
			return axis === "x" ? value * 10 : value * 7.6;
		}

		function relatedRelations(id) {
			return relations.filter(relation => relation.from === id || relation.to === id);
		}

		function relatedIds(id) {
			return [...new Set(relatedRelations(id).flatMap(relation => [relation.from, relation.to]).filter(nextId => nextId !== id))];
		}

		function positionedEntity(id) {
			const base = entityById.get(id);
			const position = currentPositions.get(id) || { x: base.x, y: base.y };
			return { ...base, ...position };
		}

		function computePositions() {
			const positions = new Map();
			entities.forEach(entity => {
				positions.set(entity.id, { x: entity.x, y: entity.y });
			});

			currentPositions = positions;
			const active = positionedEntity(activeId);
			const mapRect = galaxy.getBoundingClientRect();
			const offsetX = ((50 - active.x) / 100) * mapRect.width;
			const offsetY = ((48 - active.y) / 100) * mapRect.height;
			galaxy.style.setProperty("--focus-x", 50);
			galaxy.style.setProperty("--focus-y", 48);
			galaxy.style.setProperty("--spin", `${galaxyRotation}deg`);
			spaceCamera.style.setProperty("--cam-x", `${offsetX}px`);
			spaceCamera.style.setProperty("--cam-y", `${offsetY}px`);
			spaceCamera.style.setProperty("--cam-scale", showAll ? 1 : 1.02);
		}

		function clamp(value, min, max) {
			return Math.min(max, Math.max(min, value));
		}

		function isLayerVisible(entityId) {
			return activeLayers.has(entityById.get(entityId).layer);
		}

		function relationVisible(relation) {
			return isLayerVisible(relation.from) && isLayerVisible(relation.to);
		}

		function makePath(from, to) {
			const x1 = percentToSvg(from.x, "x");
			const y1 = percentToSvg(from.y, "y");
			const x2 = percentToSvg(to.x, "x");
			const y2 = percentToSvg(to.y, "y");
			const dx = x2 - x1;
			const dy = y2 - y1;
			const curve = Math.max(38, Math.hypot(dx, dy) * .16);
			const cx1 = x1 + dx * .42 - dy / curve * 12;
			const cy1 = y1 + dy * .18 + dx / curve * 12;
			const cx2 = x1 + dx * .64 + dy / curve * 12;
			const cy2 = y1 + dy * .82 - dx / curve * 12;
			return `M ${x1} ${y1} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${x2} ${y2}`;
		}

		function renderChrome() {
			legend.innerHTML = "";
			layers.innerHTML = "";
			Object.entries(layerMeta).forEach(([key, meta]) => {
				const item = document.createElement("div");
				item.className = "legend-item";
				item.innerHTML = `<span class="dot" style="--dot:${meta.color}"></span>${meta.name}`;
				legend.appendChild(item);

				const btn = document.createElement("button");
				btn.type = "button";
				btn.className = `layer-btn ${activeLayers.has(key) ? "on" : ""}`;
				btn.textContent = meta.name;
				btn.addEventListener("click", () => {
					if (activeLayers.has(key) && activeLayers.size > 1) {
						activeLayers.delete(key);
					} else {
						activeLayers.add(key);
					}
					render();
				});
				layers.appendChild(btn);
			});
		}

		function triggerWarp(fromId, toId) {
			if (warpTimer) window.clearTimeout(warpTimer);
			mapCard.classList.remove("warping");
			void mapCard.offsetWidth;
			mapCard.classList.add("warping");
			warpTimer = window.setTimeout(() => mapCard.classList.remove("warping"), 930);

			document.querySelectorAll(".planet.just-arrived").forEach(node => node.classList.remove("just-arrived"));
			window.setTimeout(() => {
				const activeNode = document.querySelector(`.planet[data-id="${toId}"]`);
				if (activeNode) {
					activeNode.classList.add("just-arrived");
					window.setTimeout(() => activeNode.classList.remove("just-arrived"), 780);
				}
			}, 80);

			const from = currentPositions.get(toId) || entityById.get(toId) || { x: 50, y: 48 };
			const active = currentPositions.get(activeId) || entityById.get(activeId) || { x: 50, y: 48 };
			const screenFrom = {
				x: from.x + (50 - active.x),
				y: from.y + (48 - active.y)
			};
			const to = { x: 50, y: 48 };
			const angle = Math.atan2(to.y - screenFrom.y, to.x - screenFrom.x) * 180 / Math.PI;
			ship.style.setProperty("--ship-x", screenFrom.x);
			ship.style.setProperty("--ship-y", screenFrom.y);
			void ship.offsetWidth;
			ship.style.setProperty("--ship-angle", `${angle}deg`);
			createSparks(screenFrom, to, layerMeta[entityById.get(toId).layer].color);
		}

		function createSparks(from, to, color) {
			particleField.innerHTML = "";
			const count = window.innerWidth <= 760 ? 18 : 28;
			for (let index = 0; index < count; index += 1) {
				const spark = document.createElement("span");
				spark.className = "spark";
				const jitterX = (Math.random() - .5) * 10;
				const jitterY = (Math.random() - .5) * 10;
				const sx = clamp(from.x + jitterX, 3, 97);
				const sy = clamp(from.y + jitterY, 3, 97);
				const tx = (to.x - sx) * (galaxy.clientWidth / 100) + (Math.random() - .5) * 130;
				const ty = (to.y - sy) * (galaxy.clientHeight / 100) + (Math.random() - .5) * 100;
				spark.style.setProperty("--sx", `${sx}%`);
				spark.style.setProperty("--sy", `${sy}%`);
				spark.style.setProperty("--tx", `${tx}px`);
				spark.style.setProperty("--ty", `${ty}px`);
				spark.style.setProperty("--sc", Math.random() > .55 ? color : "var(--cyan)");
				spark.style.setProperty("--sw", `${2 + Math.random() * 4}px`);
				spark.style.setProperty("--tail", `${28 + Math.random() * 72}px`);
				spark.style.setProperty("--sr", `${Math.atan2(ty, tx) * 180 / Math.PI}deg`);
				spark.style.animationDelay = `${Math.random() * 90}ms`;
				particleField.appendChild(spark);
			}
			window.setTimeout(() => {
				particleField.innerHTML = "";
			}, 980);
		}

		function renderPlanets() {
			spaceCamera.querySelectorAll(".planet").forEach(node => node.remove());
			entities.forEach(entity => {
				const position = positionedEntity(entity.id);
				const button = document.createElement("button");
				button.type = "button";
				button.className = "planet";
				button.style.setProperty("--x", position.x);
				button.style.setProperty("--y", position.y);
				button.style.setProperty("--size", `${entity.size}px`);
				button.style.setProperty("--planet", layerMeta[entity.layer].color);
				button.dataset.id = entity.id;
				button.setAttribute("aria-label", `查看${entity.name}`);
				button.innerHTML = `<span class="planet-code">${shortCode(entity.code)}</span><span class="planet-name">${entity.name}</span>`;
				button.addEventListener("click", () => selectEntity(entity.id));
				spaceCamera.appendChild(button);
			});
		}

		function shortCode(code) {
			return code
				.replace("KxtService", "")
				.replace("KxtContract", "Contract")
				.replace("Kxt", "")
				.replace("flow_form_json", "JSON")
				.replace("ServiceReceiptDTO", "入口");
		}

		function renderRelations() {
			computePositions();
			relationLayer.innerHTML = "";
			document.querySelectorAll(".relation-label").forEach(node => node.remove());
			const activeRelated = new Set(relatedRelations(activeId).flatMap(relation => [relation.from, relation.to]));
			relations.forEach((relation, index) => {
				const from = positionedEntity(relation.from);
				const to = positionedEntity(relation.to);
				const isActive = relation.from === activeId || relation.to === activeId;
				const visible = relationVisible(relation);
				const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
				path.setAttribute("d", makePath(from, to));
				path.classList.add("relation-path");
				if (isActive) path.classList.add("active");
				if ((!showAll && !isActive) || !visible) path.classList.add("muted");
				relationLayer.appendChild(path);

				const label = document.createElement("div");
				label.className = "relation-label";
				if (isActive) label.classList.add("active");
				if ((!showAll && !isActive) || !visible) label.classList.add("muted");
				label.textContent = relation.label;
				label.style.left = `${(from.x + to.x) / 2}%`;
				label.style.top = `${(from.y + to.y) / 2}%`;
				label.style.transitionDelay = `${Math.min(index * 8, 160)}ms`;
				spaceCamera.appendChild(label);
			});

			document.querySelectorAll(".planet").forEach(node => {
				const id = node.dataset.id;
				const position = currentPositions.get(id) || positionedEntity(id);
				node.style.setProperty("--x", position.x);
				node.style.setProperty("--y", position.y);
				node.classList.toggle("active", id === activeId);
				node.classList.toggle("related", activeRelated.has(id) && id !== activeId);
				node.classList.toggle("muted", !showAll && !activeRelated.has(id));
				node.classList.toggle("hidden", !isLayerVisible(id));
			});
		}

		function renderDetail() {
			const entity = entityById.get(activeId);
			const meta = layerMeta[entity.layer];
			focusText.textContent = `${entity.name} ${entity.code}`;
			detailLayer.textContent = meta.name;
			detailLayer.style.color = meta.color;
			detailTitle.textContent = entity.name;
			detailCode.textContent = entity.code;
			detailDesc.textContent = entity.desc;
			ship.style.setProperty("--ship-x", 50);
			ship.style.setProperty("--ship-y", 48);

			fieldList.innerHTML = "";
			entity.fields.forEach(([name, desc]) => {
				const li = document.createElement("li");
				li.innerHTML = `<b>${name}</b><span>${desc}</span>`;
				fieldList.appendChild(li);
			});

			const direct = relatedRelations(activeId).filter(relationVisible);
			relationList.innerHTML = "";
			nextGrid.innerHTML = "";
			if (!direct.length) {
				relationList.innerHTML = "<li><b>暂无当前筛选层级下的直接关系</b><span>打开更多层级后可继续查看。</span></li>";
			}
			direct.forEach(relation => {
				const nextId = relation.from === activeId ? relation.to : relation.from;
				const next = entityById.get(nextId);
				const direction = relation.from === activeId ? "指向" : "来源";
				const li = document.createElement("li");
				li.innerHTML = `<b>${direction}：${next.name}</b><span>${relation.label}</span>`;
				relationList.appendChild(li);

				const btn = document.createElement("button");
				btn.type = "button";
				btn.className = "next-btn";
				btn.innerHTML = `<b>${next.name}</b><span>${relation.label}</span>`;
				btn.addEventListener("click", () => selectEntity(nextId));
				nextGrid.appendChild(btn);
			});

			pathbar.innerHTML = "";
			pathTrail.slice(-8).forEach((name, index, arr) => {
				const chip = document.createElement("span");
				chip.className = "path-chip";
				chip.textContent = index === arr.length - 1 ? name : `${name} →`;
				pathbar.appendChild(chip);
			});
		}

		function selectEntity(id) {
			if (!entityById.has(id)) return;
			previousActiveId = activeId;
			activeId = id;
			galaxyRotation += 28;
			const name = entityById.get(id).name;
			if (pathTrail[pathTrail.length - 1] !== name) pathTrail.push(name);
			triggerWarp(previousActiveId, id);
			render();
		}

		function render() {
			renderChrome();
			computePositions();
			renderRelations();
			renderDetail();
		}

		document.getElementById("homeBtn").addEventListener("click", () => {
			pathTrail.push("履约主单");
			selectEntity("servicePerform");
		});

		document.getElementById("allBtn").addEventListener("click", event => {
			showAll = !showAll;
			event.currentTarget.textContent = showAll ? "只看当前关系" : "查看全部关系";
			render();
		});

		document.getElementById("pathBtn").addEventListener("click", () => {
			pathTrail = [entityById.get(activeId).name];
			renderDetail();
		});

		window.addEventListener("hashchange", () => {
			const id = decodeURIComponent(location.hash.replace("#", ""));
			if (entityById.has(id)) {
				pathTrail = [entityById.get(id).name];
				selectEntity(id);
			}
		});

		const initialId = decodeURIComponent(location.hash.replace("#", ""));
		if (entityById.has(initialId)) {
			activeId = initialId;
			pathTrail = [entityById.get(initialId).name];
		}

		computePositions();
		renderPlanets();
		render();
	</script>
</body>
</html>
