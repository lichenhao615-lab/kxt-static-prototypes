<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=1920, initial-scale=1">
	<title>服务管理 · 内部版 · 跨信通</title>
	<link rel="stylesheet" href="fulfillment-internal-list-demo.css">
</head>
<body>
	<svg class="icon-defs" aria-hidden="true">
		<symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
		<symbol id="chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
		<symbol id="copy" viewBox="0 0 24 24"><rect x="8" y="8" width="14" height="14" rx="2"/><path d="M4 16a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2"/></symbol>
		<symbol id="x" viewBox="0 0 24 24"><path d="m18 6-12 12M6 6l12 12"/></symbol>
		<symbol id="export" viewBox="0 0 24 24"><path d="M12 3v12m5-5-5-5-5 5M5 21h14a2 2 0 0 0 2-2v-4H3v4a2 2 0 0 0 2 2"/></symbol>
	</svg>
	<header class="system-bar"><div class="brand"><span class="brand-mark">Tax</span>跨信通税务管理系统</div><nav><span>系统管理</span><span class="selected">业务管理</span><span>CRM</span><span>客服工单</span><span>测试平台</span><span>数据平台</span><span>旧系统</span></nav><div class="account"><span class="demo-label">演示数据</span><span class="avatar">李</span>李晨浩</div></header>
	<aside class="side-nav"><div class="nav-item">首页<span>⌃</span></div><div class="nav-item sub">履约工作台</div><div class="nav-item sub">我的导入/导出</div><div class="nav-item sub">导出审核</div><div class="nav-item">订单管理<span>⌄</span></div><div class="nav-item">续费管理<span>⌄</span></div><div class="nav-item">客户管理<span>⌄</span></div><div class="nav-item">VAT税务<span>⌄</span></div><div class="nav-item">EPR合规<span>⌄</span></div><div class="nav-item expanded">履约管理<span>⌃</span></div><div class="nav-item sub selected">服务管理</div><div class="nav-item sub">流程配置</div><div class="nav-item">任务管理<span>⌄</span></div><div class="nav-item">SLA管理<span>⌄</span></div></aside>
	<nav class="workspace-tabs"><span>履约工作台</span><span class="selected">服务管理</span></nav>
	<main class="work-area">
		<header class="page-heading"><h1>服务管理</h1><span class="page-heading-meta">VAT</span></header>
		<section class="filter-panel" aria-label="服务筛选">
			<div class="service-tabs" id="kindRow" role="tablist" aria-label="服务分类"><button type="button" role="tab" data-kind="全部" class="selected">全部服务</button><button type="button" role="tab" data-kind="基础服务">基础服务</button><button type="button" role="tab" data-kind="增值服务">增值服务</button><button type="button" role="tab" data-kind="追加服务">追加服务</button><button type="button" role="tab" data-kind="续费服务">续费服务</button></div>
			<form id="searchForm" class="search-grid">
				<label class="query-field"><span>国家 / 地区</span><select id="country" aria-label="国家"><option value="">全部国家 / 地区</option><option>德国</option><option>法国</option></select></label>
				<label class="query-field"><span>关联会计师</span><select id="accountant" aria-label="关联会计师"><option value="">全部会计师</option><option>张静</option><option>待分配</option></select></label>
				<label class="query-field"><span>当前处理人</span><select id="owner" aria-label="当前处理人"><option value="">全部处理人</option><option>陈晓</option><option>王敏</option><option>李明</option></select></label>
				<label class="query-field keyword-field"><span>关键词</span><input id="query" placeholder="服务编号、订单号或公司名称" aria-label="查询内容" maxlength="80"></label>
				<div class="search-actions">
				<button class="btn primary" type="submit"><svg class="icon"><use href="#search"/></svg>搜索</button>
				<button class="btn" type="reset">重置</button>
				</div>
			</form>
		</section>
		<section class="node-filter" aria-label="节点及状态筛选">
			<div class="section-caption"><h2>履约进度</h2><span id="flowSummary"></span></div>
			<div class="node-row" id="nodeRow"></div>
			<div class="status-row" id="statusRow"></div>
		</section>
		<section class="result-panel">
			<div class="result-heading"><h2>服务列表</h2><span id="resultSummary"></span><div class="spacer"></div><button type="button" class="btn" id="exportButton"><svg class="icon" aria-hidden="true"><use href="#export"/></svg>导出</button></div>
			<div class="table-scroll"><table><colgroup><col style="width:36px"><col style="width:42px"><col style="width:218px"><col style="width:92px"><col style="width:182px"><col style="width:185px"><col style="width:200px"><col style="width:100px"><col style="width:115px"><col></colgroup><thead><tr><th aria-label="展开关联服务"></th><th>序号</th><th>服务编号 / 订单号</th><th>服务分类</th><th>公司 / 客户</th><th>商品信息</th><th>履约进度</th><th>当前处理人</th><th>关联会计师</th><th class="operation-column">操作</th></tr></thead><tbody id="rows"></tbody></table></div>
			<div class="table-foot"><span id="rangeInfo"></span><div class="pagination"><span id="pageInfo"></span><button type="button" class="page-arrow" disabled aria-label="上一页">‹</button><span class="page-current">1</span><button type="button" class="page-arrow" disabled aria-label="下一页">›</button></div></div>
		</section>
	</main>
	<div class="toast" id="toast" hidden></div>
	<dialog id="operationDialog" aria-labelledby="operationTitle"><header><h2 id="operationTitle"></h2><button type="button" class="dialog-close" data-close-operation aria-label="关闭">×</button></header><div id="operationBody"></div><footer><button type="button" class="btn" data-close-operation>关闭</button></footer></dialog>
	<script src="fulfillment-unified-data.js"></script>
	<script src="fulfillment-internal-list-demo.js"></script>
</body>
</html>
