<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>VAT & EPR 自动化进程产品地图</title>
	<style>
		:root {
			color-scheme: light;
			--bg: #f3f6fa;
			--surface: #ffffff;
			--text: #172033;
			--muted: #667085;
			--line: #dce4ef;
			--navy: #16243d;
			--teal: #0f8b78;
			--blue: #1d5fd6;
			--shadow: 0 18px 45px rgba(22, 36, 61, 0.09);
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			background: linear-gradient(180deg, #eaf2f5 0, rgba(234, 242, 245, 0) 260px), var(--bg);
			color: var(--text);
			font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
			letter-spacing: 0;
		}

		.shell {
			width: min(1360px, calc(100vw - 40px));
			margin: 30px auto 48px;
		}

		.hero {
			display: grid;
			grid-template-columns: 1fr auto;
			gap: 24px;
			align-items: start;
			padding: 28px 30px;
			border: 1px solid rgba(255, 255, 255, 0.68);
			border-radius: 18px;
			background: linear-gradient(135deg, rgba(15, 139, 120, 0.96), rgba(22, 36, 61, 0.98)), var(--navy);
			box-shadow: var(--shadow);
		}

		.eyebrow {
			margin: 0 0 8px;
			color: rgba(255, 255, 255, 0.74);
			font-size: 13px;
			font-weight: 700;
		}

		h1, p {
			margin: 0;
		}

		h1 {
			color: #fff;
			font-size: 34px;
			line-height: 1.25;
		}

		.report-meta {
			min-width: 250px;
			padding: 14px 16px;
			border: 1px solid rgba(255, 255, 255, 0.28);
			border-radius: 12px;
			background: rgba(255, 255, 255, 0.12);
			color: rgba(255, 255, 255, 0.78);
			font-size: 13px;
			line-height: 1.8;
			backdrop-filter: blur(10px);
		}

		.report-meta label {
			display: block;
			color: #fff;
			font-size: 13px;
			margin-bottom: 6px;
		}

		.report-meta select {
			width: 100%;
			min-height: 40px;
			padding: 7px 10px;
			border: 1px solid #dce4ef;
			border-radius: 6px;
			background: #fff;
			color: var(--text);
			font: inherit;
			font-weight: 700;
			cursor: pointer;
		}

		.month-period {
			margin-top: 7px;
			font-size: 12px;
		}

		.result-heading {
			margin: 0;
			padding: 16px 22px 0;
			color: var(--text);
			font-size: 17px;
		}

		.result-heading span {
			display: inline-block;
			margin-left: 12px;
			color: var(--muted);
			font-size: 12px;
			font-weight: 400;
		}

		.month-status {
			margin-left: auto;
			align-self: center;
			padding: 0 12px;
			color: var(--muted);
			font-size: 12px;
		}

		.hero,
		.tabs,
		.tab,
		.report-meta {
			border-radius: 8px;
		}

		.tabs {
			margin-top: 20px;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: var(--surface);
			box-shadow: var(--shadow);
			overflow: hidden;
		}

		.tab-list {
			display: flex;
			gap: 8px;
			padding: 12px;
			border-bottom: 1px solid var(--line);
			background: linear-gradient(90deg, #f8fbff, #f4faf8);
		}

		.tab {
			flex: 0 0 180px;
			min-height: 44px;
			padding: 10px 18px;
			border: 1px solid transparent;
			border-radius: 8px;
			background: transparent;
			color: var(--muted);
			font: inherit;
			font-size: 15px;
			font-weight: 800;
			cursor: pointer;
		}

		.tab:hover {
			background: rgba(255, 255, 255, 0.75);
			color: var(--navy);
		}

		.tab.active {
			border-color: rgba(15, 139, 120, 0.24);
			background: var(--surface);
			box-shadow: 0 5px 14px rgba(22, 36, 61, 0.08);
			color: var(--navy);
		}

		.tab:focus-visible {
			outline: 3px solid rgba(29, 95, 214, 0.28);
			outline-offset: 2px;
		}

		.tab-panel {
			background: var(--surface);
		}

		.tab-panel[hidden] {
			display: none;
		}

		.page-frame {
			display: block;
			width: 100%;
			border: 0;
			background: var(--bg);
		}

		.vat-frame {
			height: 2500px;
		}

		.epr-frame {
			height: 4700px;
		}

		@media (max-width: 720px) {
			.shell {
				width: calc(100vw - 20px);
				margin: 10px auto 24px;
			}

			.hero {
				display: block;
				padding: 22px 20px;
			}

			h1 {
				font-size: 26px;
			}

			.report-meta {
				min-width: 0;
				margin-top: 18px;
			}

			.tab-list {
				flex-wrap: wrap;
				gap: 6px;
				padding: 8px;
			}

			.tab {
				flex: 1 1 0;
				padding: 9px 8px;
				font-size: 14px;
			}

			.month-status {
				display: none;
			}

			.result-heading {
				padding: 14px 12px 0;
			}

			.result-heading span {
				display: block;
				margin: 5px 0 0;
			}

			.page-frame {
				height: auto;
			}

			.vat-frame {
				height: 3600px;
			}

			.epr-frame {
				height: 5750px;
			}
		}

		@media print {
			body {
				background: #fff;
			}

			.hero,
			.tab-list {
				box-shadow: none;
			}

			.tab-panel[hidden] {
				display: block;
			}

			.tab-panel + .tab-panel {
				page-break-before: always;
			}
		}
	</style>
</head>
<body>
	<main class="shell">
		<header class="hero">
			<div>
				<p class="eyebrow">自动化月度通晒 · 2026</p>
				<h1>VAT &amp; EPR 自动化进程产品地图</h1>
			</div>
			<div class="report-meta">
				<label for="resultMonth">月份结果</label>
				<select id="resultMonth">
					<option value="current">现状</option>
					<option value="2026-10" selected>2026 年 10 月通晒结果</option>
					<option value="2026-09">2026 年 9 月通晒结果</option>
				</select>
				<p class="month-period" id="monthPeriod">2026.10.01 至 2026.10.31</p>
			</div>
		</header>

		<section class="tabs" aria-label="产品线切换">
			<div class="tab-list" role="tablist" aria-label="VAT 与 EPR 产品地图">
				<button class="tab active" id="vatTab" type="button" role="tab" aria-selected="true" aria-controls="vatPanel" data-target="vatPanel">VAT 自动化</button>
				<button class="tab" id="eprTab" type="button" role="tab" aria-selected="false" aria-controls="eprPanel" tabindex="-1" data-target="eprPanel">EPR 自动化</button>
				<span class="month-status" id="monthStatus">Q4 重点项目 · 5 项</span>
			</div>

			<h2 class="result-heading" id="resultHeading" aria-live="polite">2026 年 10 月通晒结果<span>统计更新：2026.11.04</span></h2>
			<div class="tab-panel" id="vatPanel" role="tabpanel" aria-labelledby="vatTab">
				<iframe class="page-frame vat-frame" src="vat-automation-product-map.html?v=20261104-inline-change&amp;period=2026-10" data-month="2026-10" title="2026 年 10 月 VAT 自动化产品地图"></iframe>
			</div>
			<div class="tab-panel" id="eprPanel" role="tabpanel" aria-labelledby="eprTab" hidden>
				<iframe class="page-frame epr-frame" src="epr-automation-product-map.html?v=20261104-inline-change&amp;period=2026-10" data-month="2026-10" title="2026 年 10 月 EPR 自动化进程产品地图"></iframe>
			</div>
		</section>
	</main>

	<script>
		const tabs = [...document.querySelectorAll(".tab")];
		let frames = [...document.querySelectorAll(".page-frame")];
		const monthSelect = document.getElementById("resultMonth");
		const months = {
			"current": { label: "现状", period: "2026.10.01 至 2026.10.31", path: "", updated: "统计更新：2026.11.04 · 自动化率对比十月" },
			"2026-10": { label: "2026 年 10 月通晒结果", period: "2026.10.01 至 2026.10.31", path: "", updated: "统计更新：2026.11.04 · 自动化率对比九月" },
			"2026-09": { label: "2026 年 9 月通晒结果", period: "2026.09.01 至 2026.09.30", path: "automation-monthly/2026-09/", updated: "历史快照" }
		};

		window.addEventListener("message", (event) => {
			const frame = frames.find((item) => item.contentWindow === event.source);
			if (!frame || event.data?.type !== "automation-map-height") return;
			const height = event.data.height;
			if (Number.isFinite(height) && height > 0 && height < 100000 && !frame.closest(".tab-panel").hidden) {
				frame.style.height = `${height}px`;
			}
		});
		const observeFrame = (frame) => {
			frame.addEventListener("load", () => frame.contentWindow.postMessage({ type: "automation-map-measure" }, "*"));
		};
		frames.forEach(observeFrame);

		const activateTab = (tab) => {
			const targetId = tab.dataset.target;
			tabs.forEach((item) => {
				const isActive = item === tab;
				item.classList.toggle("active", isActive);
				item.setAttribute("aria-selected", String(isActive));
				item.tabIndex = isActive ? 0 : -1;
			});
			document.querySelectorAll(".tab-panel").forEach((panel) => {
				panel.hidden = panel.id !== targetId;
			});
			document.querySelector(`#${targetId} iframe`).contentWindow.postMessage({ type: "automation-map-measure" }, "*");
		};

		const applyState = (month, product, historyMode) => {
			const result = months[month];
			monthSelect.value = month;
			document.getElementById("monthPeriod").textContent = result.period;
			document.getElementById("resultHeading").innerHTML = `${result.label}<span>${result.updated}</span>`;
			document.getElementById("monthStatus").textContent = month === "2026-09" ? "9 月历史快照" : "Q4 重点项目 · 5 项";
			document.title = `${result.label} | VAT & EPR 自动化进程产品地图`;
			frames = frames.map((frame, index) => {
				const line = index === 0 ? "vat" : "epr";
				if (frame.dataset.month !== month) {
					// 重建嵌入页，避免 iframe 导航进入浏览器的月份返回历史。
					const replacement = frame.cloneNode(false);
					replacement.src = `${result.path}${line}-automation-product-map.html?v=20261104-inline-change&period=${month}`;
					replacement.dataset.month = month;
					replacement.style.removeProperty("height");
					observeFrame(replacement);
					frame.replaceWith(replacement);
					frame = replacement;
				}
				frame.title = `${result.label} · ${line.toUpperCase()} 自动化产品地图`;
				return frame;
			});
			activateTab(document.getElementById(`${product}Tab`));
			if (historyMode) {
				const url = new URL(window.location.href);
				url.searchParams.set("month", month);
				url.searchParams.set("tab", product);
				window.history[historyMode]({ month, product }, "", url);
			}
		};

		const restoreState = (historyMode) => {
			const params = new URLSearchParams(window.location.search);
			const month = Object.hasOwn(months, params.get("month")) ? params.get("month") : "2026-10";
			const product = params.get("tab") === "epr" ? "epr" : "vat";
			applyState(month, product, historyMode);
		};

		monthSelect.addEventListener("change", () => {
			const product = document.getElementById("eprTab").getAttribute("aria-selected") === "true" ? "epr" : "vat";
			applyState(monthSelect.value, product, "pushState");
		});
		tabs.forEach((tab, index) => {
			const selectTab = (nextTab) => applyState(monthSelect.value, nextTab.id === "eprTab" ? "epr" : "vat", "pushState");
			tab.addEventListener("click", () => selectTab(tab));
			tab.addEventListener("keydown", (event) => {
				if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
				event.preventDefault();
				const direction = event.key === "ArrowRight" ? 1 : -1;
				const nextIndex = event.key === "Home" ? 0 : event.key === "End" ? tabs.length - 1 : (index + direction + tabs.length) % tabs.length;
				const nextTab = tabs[nextIndex];
				nextTab.focus();
				selectTab(nextTab);
			});
		});
		window.addEventListener("popstate", () => restoreState());
		restoreState("replaceState");
	</script>
</body>
</html>
